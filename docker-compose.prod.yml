services:
  backend:
    build:
      context: ./expressjs
      dockerfile: Dockerfile
    container_name: medical_backend
    restart: unless-stopped
    environment:
      PORT: 4000
      CLIENT_URL: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-secret-before-deploying-123456}
      DATABASE_URL: file:./data/medical.db
    ports:
      - "4000:4000"
    volumes:
      - backend_data:/app/prisma/data

  frontend:
    build:
      context: ./reactjs
      dockerfile: Dockerfile
    container_name: medical_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  backend_data:

