services:
  backend:
    build:
      context: ./expressjs
      dockerfile: Dockerfile.dev
    container_name: medical_backend
    restart: unless-stopped
    environment:
      PORT: 4000
      CLIENT_URL: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-secret-before-deploying-123456}
      DATABASE_URL: file:./data/medical.db
    ports:
      - "4000:4000"
    volumes:
      - ./expressjs:/app
      - backend_node_modules:/app/node_modules
      - backend_data:/app/data
    depends_on: []

  frontend:
    build:
      context: ./reactjs
      dockerfile: Dockerfile.dev
    container_name: medical_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: /api
      VITE_PROXY_TARGET: http://backend:4000
      VITE_HMR_CLIENT_PORT: 3000
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    ports:
      - "3000:5173"
    volumes:
      - ./reactjs:/app
      - frontend_node_modules:/app/node_modules
    depends_on: []

volumes:
  backend_node_modules:
  frontend_node_modules:
  backend_data:
